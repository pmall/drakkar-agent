[project]
name = "drakkar-agent"
version = "0.1.0"
description = "Query the drakkar PPI database and produce datasets."
requires-python = ">=3.14"
dependencies = [
    "polars>=1.44.1",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drakkar"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.5",
]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pyright]
include = ["drakkar", "scripts"]
